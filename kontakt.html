  <main class="contact-container">
    <h2>Kontakta oss</h2>
    <p>Har du frågor om receptet eller vill du dela med dig av dina pannkaksbilder? Skriv till oss!</p>

    <form class="contact-form">
      <div class="form-group">
        <label for="name">Namn</label>
        <input type="text" id="name" placeholder="Ditt namn" required>
      </div>
      <div class="form-group">
        <label for="email">E-postadress</label>
        <input type="email" id="email" placeholder="din.email@adress.com" required>
      </div>
      <div class="form-group">
        <label for="message">Meddelande</label>
        <textarea id="message" rows="5" placeholder="Skriv ditt meddelande här..." required></textarea>
      </div>
      <button type="submit" class="submit-btn">Skicka meddelande</button>
    </form>
  </main>
